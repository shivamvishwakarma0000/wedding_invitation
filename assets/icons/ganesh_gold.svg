<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#7A5600" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#FFD54F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </radialGradient>
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#40050e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="150" cy="150" r="140" fill="url(#haloGlow)" />

  <!-- Outer Ornate Ring -->
  <circle cx="150" cy="150" r="136" stroke="url(#goldLuster)" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="150" cy="150" r="128" stroke="url(#goldLuster)" stroke-width="1.5" />
  <circle cx="150" cy="150" r="122" stroke="url(#goldLuster)" stroke-width="4" />

  <!-- Sacred Lord Ganesha Silhouette & Ornaments -->
  <g fill="url(#goldLuster)" filter="url(#royalShadow)">
    <!-- Crown / Mukut -->
    <path d="M150 42 L164 74 L150 82 L136 74 Z" />
    <circle cx="150" cy="38" r="5" />
    <path d="M136 76 Q150 68 164 76 L168 86 Q150 78 132 86 Z" />
    <circle cx="150" cy="94" r="4.5" fill="#C2185B" />

    <!-- Trishul / Tilak -->
    <path d="M147 100 H153 V120 H147 Z M142 104 C142 112 147 114 147 114 C147 114 145 106 142 104 Z M158 104 C158 112 153 114 153 114 C153 114 155 106 158 104 Z" fill="#D32F2F" />

    <!-- Head & Ears -->
    <!-- Left Ear -->
    <path d="M116 105 C85 102 72 125 75 150 C78 170 95 180 114 176 C108 160 108 135 120 120 Z" />
    <!-- Right Ear -->
    <path d="M184 105 C215 102 228 125 225 150 C222 170 205 180 186 176 C192 160 192 135 180 120 Z" />

    <!-- Head Curve & Trunk (Sondh) with Modak at Tip -->
    <path d="M150 90 C172 90 186 108 184 135 C182 155 170 172 166 195 C162 218 172 232 186 230 C190 228 192 220 186 218 C176 218 174 206 176 194 C180 174 196 152 196 128 C196 95 174 76 150 76 C126 76 104 95 104 128 C104 152 120 174 124 194 C126 206 124 218 114 218 C108 220 110 228 114 230 C128 232 138 218 134 195 C130 172 118 155 116 135 C114 108 128 90 150 90 Z" />

    <!-- Tusks (Dant) -->
    <!-- Left Full Tusk -->
    <path d="M136 155 L124 170 L140 164 Z" fill="#FFF9C4" />
    <!-- Right Broken Tusk (Ekdant) -->
    <path d="M164 155 L170 162 L160 163 Z" fill="#FFF9C4" />

    <!-- Modak / Ladoo -->
    <circle cx="188" cy="224" r="8" fill="#FFC107" />
    <circle cx="192" cy="220" r="3" fill="#FF9800" />

    <!-- Ornate Necklace (Haar) -->
    <path d="M125 185 Q150 205 175 185" stroke="url(#goldLuster)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="150" cy="200" r="5" fill="#D32F2F" />
  </g>
</svg>
