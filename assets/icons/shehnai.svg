<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
  </defs>
  <!-- Shehnai 1 -->
  <g transform="rotate(45 80 80)">
    <path d="M76 20 L84 20 L88 110 L98 135 L62 135 L72 110 Z" fill="url(#sg)"/>
    <!-- Holes -->
    <circle cx="80" cy="50" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="65" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="80" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="95" r="2.5" fill="#5D4037"/>
    <!-- Bell rim -->
    <ellipse cx="80" cy="135" rx="18" ry="5" fill="#FFA000"/>
  </g>
  <!-- Shehnai 2 crossed -->
  <g transform="rotate(-45 80 80)">
    <path d="M76 20 L84 20 L88 110 L98 135 L62 135 L72 110 Z" fill="url(#sg)" opacity="0.85"/>
    <circle cx="80" cy="50" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="65" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="80" r="2.5" fill="#5D4037"/>
    <circle cx="80" cy="95" r="2.5" fill="#5D4037"/>
    <ellipse cx="80" cy="135" rx="18" ry="5" fill="#FFA000"/>
  </g>
</svg>
