<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Invitation | शिवानी संग सौरभ</title>
  
  <script>
    // Smart router:
    // If URL has guest parameters (?to=... or ?guest=... or ?name=...), redirect directly to invite.html with params!
    const query = window.location.search;
    const hash = window.location.hash;
    if (query && (query.includes('to=') || query.includes('guest=') || query.includes('name='))) {
      window.location.replace('invite.html' + query + hash);
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --burgundy: #380711;
      --gold: #d4af37;
      --gold-light: #f7e7be;
      --gold-bright: #ffe082;
      --ivory: #faf7f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 15%, #35050f 0%, #150105 100%);
      color: #2a140d;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 60px 12px;
    }
    .landing-card {
      width: 100%;
      max-width: 520px;
      background: var(--ivory);
      border: 2px solid var(--gold);
      border-radius: 22px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.6);
      margin-top: 20px;
    }
    .ganesh-frame {
      width: 86px;
      height: 86px;
      margin: 0 auto 14px auto;
      border-radius: 50%;
      border: 3px solid var(--gold);
      background: radial-gradient(circle, #5a101d 0%, #280209 100%);
      padding: 4px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }
    .ganesh-frame img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .main-heading {
      font-family: 'Rozha One', 'Cinzel', serif;
      font-size: 2rem;
      color: var(--burgundy);
      margin-bottom: 4px;
    }
    .sub-heading {
      font-size: 0.95rem;
      color: #8c6d1d;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .nav-choice-btn {
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, #aa820a 100%);
      color: #280309;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
    }
    .btn-burgundy {
      background: var(--burgundy);
      color: var(--gold-light);
      border: 1px solid var(--gold);
      box-shadow: 0 4px 16px rgba(56, 7, 17, 0.3);
    }
    .btn-green {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
    }
    .nav-choice-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="landing-card">
    <div class="ganesh-frame">
      <img src="assets/icons/real_ganesha.png" alt="Lord Ganesha">
    </div>

    <div style="font-size: 0.8rem; letter-spacing: 2px; color: #8c6d1d; text-transform: uppercase;">
      ॥ श्री गणेशाय नमः ॥ • ॥ श्री विन्ध्यवासिनी देव्यै नमः ॥
    </div>
    <h1 class="main-heading">शिवानी संग सौरभ</h1>
    <p class="sub-heading">विवाह निमंत्रण • Saturday, 05 December 2026</p>

    <div class="choice-stack">
      <!-- Choice 1: Open Wedding Invitation directly -->
      <a href="invite.html" class="nav-choice-btn btn-burgundy">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>शादी का निमंत्रण पत्र खोलें (View Invitation)</span>
      </a>

      <!-- Choice 2: Open Guest WhatsApp Invite Generator -->
      <a href="generator.html" class="nav-choice-btn btn-green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        <span>नया इनवाइट बनाएं (WhatsApp Generator)</span>
      </a>
    </div>
  </div>

</body>
</html>
